services:
  webserver:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
